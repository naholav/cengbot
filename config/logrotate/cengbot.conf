# CengBot logrotate configuration (TEMPLATE)
#
# Rotates the stdout/stderr logs of the services. These files are written by
# shell redirection (scripts/start_system.sh) or by systemd
# `StandardOutput=append:` (units from scripts/optimize_linux.sh), so Python's
# RotatingFileHandler cannot rotate them. `copytruncate` copies the file and
# truncates it in place, which is safe because every writer appends (O_APPEND).
#
# NOT listed on purpose (rotated by Python's RotatingFileHandler already):
#   logs/error.log (src/error_handler.py), logs/system_monitor.log (src/system_monitor.py)
#
# Placeholders (written with surrounding @ below), substituted by scripts/rotate_logs.sh:
#   PROJECT_DIR  absolute project path
#   SU_LINE      "su <user> <group>" for the root-run (/etc/logrotate.d) variant,
#                empty for the per-user variant
#
# Install / run (see scripts/README.md, "Log rotation"):
#   scripts/rotate_logs.sh                 # rotate now as the current user (no root)
#   scripts/rotate_logs.sh --install-cron  # hourly user crontab entry (no root)
#   sudo scripts/optimize_linux.sh --only logrotate   # /etc/logrotate.d/cengbot + hourly cron
#   scripts/rotate_logs.sh --debug         # logrotate -d: show what would happen, change nothing

@PROJECT_DIR@/logs/worker.log
@PROJECT_DIR@/logs/bot.log
@PROJECT_DIR@/logs/admin.log
@PROJECT_DIR@/logs/frontend.log
@PROJECT_DIR@/logs/monitor.log
@PROJECT_DIR@/logs/excel_export.log
@PROJECT_DIR@/logs/deployment.log
@PROJECT_DIR@/logs/optimization.log
{
    @SU_LINE@
    size 50M
    rotate 5
    copytruncate
    compress
    missingok
    notifempty
}
